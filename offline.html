<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; img-src 'self'; font-src 'self'; style-src 'self'; script-src 'self'; worker-src 'self'; connect-src 'self'; manifest-src 'self'; upgrade-insecure-requests">

<body>

      <img class="brand-mark" src="icons/icon-192.png?v=15.16" width="40" height="40" alt="Seclusa">
    </a>
    <ul class="links">
      <li class="theme-menu">
        <button type="button" class="theme-toggle" data-theme-toggle aria-expanded="false" aria-haspopup="dialog" aria-controls="theme-sheet">Theme</button>
        <div class="theme-sheet" id="theme-sheet" data-theme-sheet role="dialog" aria-label="Theme" hidden>

          <div class="theme-sheet__row" role="radiogroup" aria-label="Colour mode">

            <button type="button" role="radio" data-theme-opt="light" aria-checked="false">Light</button>
            <button type="button" role="radio" data-theme-opt="dark" aria-checked="false">Dark</button>
          </div>
        </div>
      </li>
    </ul>
  </nav>
  <main class="wrap offline-main">
    <p class="label">// offline</p>
    <h1>You're offline</h1>
    <p class="sub">This page is cached on your device. Reconnect to load the latest site.</p>
    <p class="source-browse"><a href="./">← Back home</a></p>
